spring.application.name=demo
server.port=8080

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/coromandel_server2
spring.datasource.username=postgres
spring.datasource.password=swift
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG
jwt.secret=your-very-long-random-secret-string-at-least-32-characters-for-hs256
server.servlet.context-path=/api/v1/admin
logging.level.org.springframework.web=DEBUG